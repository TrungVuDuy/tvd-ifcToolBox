name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Windows only: the Esent store and the bundled IfcConvert executable are Windows specific.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore IfcToolbox.sln

      - name: Build
        run: dotnet build IfcToolbox.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test IfcToolbox.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
        env:
          # The bSDD tests call the live service. Set this to 1 to skip them instead of
          # failing the build when api.bsdd.buildingsmart.org is unreachable.
          IFCTOOLBOX_SKIP_NETWORK_TESTS: '0'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      # IfcConvert goes in its own package, IfcToolbox.IfcConvert, not inside IfcToolbox.Core.
      - name: Pack
        run: dotnet pack IfcToolbox.sln --configuration Release --output artifacts

      # Install the tool from the packages just built and run it, so a broken package
      # layout (e.g. IfcConvert not reaching the tool) fails the build.
      - name: Smoke test the packaged tool
        shell: pwsh
        run: |
          $version = (Select-Xml -Path Directory.Build.props -XPath "//Version").Node.InnerText
          dotnet tool install IfcToolbox.Cli --version $version --tool-path tools --add-source artifacts
          ./tools/ifctoolbox --version
          ./tools/ifctoolbox info IfcToolbox.Tests/TestFiles/Ifc4x3/Infra-Road.ifc --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "info failed" }
          Copy-Item IfcToolbox.Tests/TestFiles/Ifc4_SampleHouse.ifc smoke.ifc
          ./tools/ifctoolbox convert smoke.ifc --format glb
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path smoke.glb)) { throw "convert failed" }

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*

      # A standalone ifctoolbox.exe (no .NET needed on the target machine) with IfcConvert
      # beside it, downloadable from the run's artifacts for manual testing.
      - name: Publish standalone executable
        run: dotnet publish IfcToolbox.Cli/IfcToolbox.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish/ifctoolbox-win-x64

      - name: Smoke test the standalone executable
        shell: pwsh
        run: |
          ./publish/ifctoolbox-win-x64/ifctoolbox.exe georef IfcToolbox.Tests/TestFiles/Ifc4x3/Building-Architecture.ifc
          if ($LASTEXITCODE -ne 0) { throw "georef failed" }
          Copy-Item IfcToolbox.Tests/TestFiles/Ifc4_SampleHouse.ifc standalone.ifc
          ./publish/ifctoolbox-win-x64/ifctoolbox.exe convert standalone.ifc --format glb
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path standalone.glb)) { throw "convert failed" }
          # The licences IfcConvert (LGPL) and the toolbox (GPL) need handed out with the exe.
          foreach ($file in 'LICENSE.txt', 'THIRD-PARTY-NOTICES.md', 'licenses/LGPL-3.0.txt') {
            if (-not (Test-Path "publish/ifctoolbox-win-x64/$file")) { throw "$file is missing from the standalone executable" }
          }

      - name: Upload standalone executable
        uses: actions/upload-artifact@v7
        with:
          name: ifctoolbox-win-x64
          path: publish/ifctoolbox-win-x64/*

      # The desktop app, self-contained: a folder with IfcToolbox.exe that runs without
      # installing .NET or the Windows App SDK.
      - name: Publish the desktop app
        run: dotnet publish IfcToolbox.App/IfcToolbox.App.csproj -c Release -p:DebugType=none -o publish/IfcToolbox-app-win-x64

      # A WinUI app cannot be shown on the build agent, so check that what it needs to start
      # and to convert made it into the folder; a missing .pri crashes it before any window.
      - name: Check the desktop app folder
        shell: pwsh
        run: |
          foreach ($file in 'IfcToolbox.exe', 'IfcToolbox.pri', 'IfcConvert_x64.exe', 'Assets/AppLogo.png', 'Microsoft.ui.xaml.dll',
                           'LICENSE.txt', 'THIRD-PARTY-NOTICES.md', 'licenses/LGPL-3.0.txt', 'licenses/CDDL-1.0.txt') {
            if (-not (Test-Path "publish/IfcToolbox-app-win-x64/$file")) { throw "$file is missing from the published app" }
          }

      - name: Upload the desktop app
        uses: actions/upload-artifact@v7
        with:
          name: IfcToolbox-app-win-x64
          path: publish/IfcToolbox-app-win-x64/*
